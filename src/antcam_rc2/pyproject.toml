[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antcam-rc2"
dynamic = ["version"]
description = "AntCAM RC2 — operation-centric CNC CAM engine (2.5D, 3-axis)."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "The Ant Team", email = "compact.pcb.maker.team@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pydantic>=2",
    "pydantic-settings>=2",
    "scipy",
    "shapely",
    "pyclipper",
    "ezdxf",
    "svgpathtools",
    "jsonschema>=4.25",
    "trimesh>=4",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
3d = [
    "cadquery-ocp",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]

[project.scripts]
antcam-rc2 = "antcam_rc2.__main__:main"

[project.urls]
homepage = "https://github.com/TheAntTeam/antcam"

[tool.hatch.version]
path = "src/antcam_rc2/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/antcam_rc2"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]


[tool.coverage.run]
branch = true
source = ["src/antcam_rc2/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.uv]
package = true
default-groups = ["dev"]