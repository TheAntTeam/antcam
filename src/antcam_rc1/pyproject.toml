[project]
name = "antcam"
version = "0.1.0"
description = "CNC CAM tools — open source CAM engine"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "typer>=0.25",
    "rich",
    "cadquery-ocp>=7.9",
    "trimesh>=4.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "coverage>=7"]

[project.scripts]
antcam = "antcam.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antcam"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 50

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ty]
python-version = "3.13"
